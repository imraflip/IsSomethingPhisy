[project]
name = "issomethingphisy-backend"
version = "0.1.0"
description = "IsSomethingPhisy — phishing URL detector backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlmodel>=0.0.22,<1",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "tldextract>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx",
    "ruff>=0.6,<1",
    "pre-commit>=4,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
